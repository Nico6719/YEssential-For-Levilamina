name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'tooth.json'   # 只有 tooth.json 变动才触发

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # 需要对比前一个 commit

      - name: 检测版本号是否变化
        id: ver
        run: |
          NEW=$(jq -r '.version' tooth.json)
          OLD=$(git show HEAD~1:tooth.json 2>/dev/null | jq -r '.version' 2>/dev/null || echo "")
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          if [ "$NEW" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "版本未变化 ($NEW)，跳过发布"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "版本变化: $OLD → $NEW，准备发布"
          fi

      - name: 校验 manifest.json 与 tooth.json 版本一致
        if: steps.ver.outputs.changed == 'true'
        run: |
          TOOTH_VER="${{ steps.ver.outputs.new }}"
          MANIFEST_VER=$(jq -r '.version' manifest.json)

          # tooth.json 带 v 前缀，manifest.json 不带，统一去掉 v 再对比
          TOOTH_PLAIN="${TOOTH_VER#v}"
          MANIFEST_PLAIN="${MANIFEST_VER#v}"

          echo "tooth.json    版本: $TOOTH_VER"
          echo "manifest.json 版本: $MANIFEST_VER"

          if [ "$TOOTH_PLAIN" != "$MANIFEST_PLAIN" ]; then
            echo "::error::版本号不一致！tooth.json=$TOOTH_VER，manifest.json=$MANIFEST_VER，请同步后重新 push"
            exit 1
          fi
          echo "✓ 版本号一致: $TOOTH_VER"

      - name: 提取本次版本的更新日志
        if: steps.ver.outputs.changed == 'true'
        id: notes
        run: |
          VERSION="${{ steps.ver.outputs.new }}"
          # 提取 CHANGELOG.md 中 ## $VERSION 到下一个 ## 之间的内容
          NOTES=$(awk "/^## ${VERSION}[[:space:]]*/,/^## /" CHANGELOG.md \
            | head -n -1 | tail -n +2)
          if [ -z "$NOTES" ]; then
            NOTES="请查看 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 打包 YEssential.zip
        if: steps.ver.outputs.changed == 'true'
        run: |
          mkdir -p dist/YEssential
          cp YEssential.js manifest.json dist/YEssential/
          cp -r modules dist/YEssential/
          cd dist && zip -r ../YEssential.zip YEssential
          echo "--- 打包内容 ---"
          unzip -l ../YEssential.zip

      - name: 创建 Release 并上传
        if: steps.ver.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.new }}"
          gh release create "$VERSION" YEssential.zip \
            --title "$VERSION" \
            --notes "${{ steps.notes.outputs.notes }}"
